name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      SIGN_FIREFOX: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: changes
        name: Check whether the extension changed
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git diff --quiet HEAD~1 HEAD -- extension scripts/build-extension.mjs; then
            echo "extension=true" >> "$GITHUB_OUTPUT"
          else
            echo "extension=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          TOOL_URL: ${{ env.SITE_URL }}
          FIREFOX_BUILD: ${{ env.SIGN_FIREFOX == 'true' && steps.changes.outputs.extension == 'true' && github.run_number || '' }}
      - name: Sign the Firefox add-on with Mozilla
        if: env.SIGN_FIREFOX == 'true' && steps.changes.outputs.extension == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@8.3.0 sign --source-dir dist-extension/production-firefox --artifacts-dir signed --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET" --approval-timeout 900000
          cp signed/*.xpi dist/linkedin-network-extension.xpi
          node scripts/extension-info.mjs dist/extension.json signed
      - name: Keep the signed Firefox add-on from the live site
        if: env.SIGN_FIREFOX == 'true' && steps.changes.outputs.extension == 'false'
        run: |
          if curl -fsSL "${SITE_URL}extension.json" -o live-extension.json && node scripts/extension-info.mjs live-extension.json is-signed; then
            curl -fsSL "${SITE_URL}linkedin-network-extension.xpi" -o dist/linkedin-network-extension.xpi
            node scripts/extension-info.mjs dist/extension.json copy-firefox live-extension.json
          fi
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
